[package]
name = "mocktave"
version = "0.1.6"
edition = "2021"
authors = ["Chris McComb <ccmcc2012@gmail.com>"]
description = "Run Octave/MATLAB inside Rust"
readme = "README.md"
repository = "https://github.com/cmccomb/mocktave"
homepage = "https://github.com/cmccomb/mocktave"
documentation = "https://docs.rs/mocktave"
license = "MIT OR Apache-2.0"
keywords = ["matlab", "octave", "scientific", "scripting", "scripting-language"]
categories = ["science", "development-tools::testing", "parser-implementations"]

[features]
# Keep Docker as the default for existing consumers. Choose another backend with
# default-features = false and features = ["bundled"] or ["native"].
default=["docker"]
docker = ["bollard", "futures-util", "tokio"]
native = ["dep:tempfile"]
bundled = ["native", "dep:directories", "dep:flate2", "dep:fs2", "dep:tar", "dep:serde_json", "dep:sha2", "dep:ureq"]

[dependencies]
bollard = {version="0.18", optional=true}
futures-util = {version = ">=0.3.0", optional=true}
human_regex = "0.3.0"
regex = ">=1.11.0"
tokio = { version = ">=1.42.0", optional = true, features = ["rt-multi-thread"] }
tempfile = { version = "3", optional = true }
directories = { version = "6", optional = true }
flate2 = { version = "1", optional = true }
fs2 = { version = "0.4", optional = true }
tar = { version = "0.4", optional = true }
serde_json = { version = "1", optional = true }

[build-dependencies]
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "bundled"
required-features = ["bundled"]
